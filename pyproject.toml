[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap2000-automation"
version = "0.1.0"
description = "Automate SAP2000 analysis and steel design through the Windows COM API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shahin" }]
keywords = ["sap2000", "structural-engineering", "automation", "com"]
dependencies = [
  "pywin32>=306",
  "pandas>=2.1",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
sap2000-auto = "sap2000_automation.cli:app"

[project.urls]
Homepage = "https://github.com/shahin-ro/sap2000-automation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/sap2000_automation/cli.py" = ["B008"]
